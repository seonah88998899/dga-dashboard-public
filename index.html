<meta charset="utf-8" />
<title>변압기 유중가스 분석 시스템</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    color-scheme: light;
    --bg: #eef1f6;
    --page-plane: #e6eaf1;
    --surface: #ffffff;
    --surface-2: #f3f5f9;
    --surface-3: #e9edf3;
    --border: #d8dfe9;
    --text: #16202e;
    --text-secondary: #4b5768;
    --text-muted: #8590a1;
    --accent: #2f5fa8;
    --accent-ink: #ffffff;
    --accent-soft: #e3ebf7;
    --good: #0ca30c;
    --good-soft: #e5f6e2;
    --warning: #b5790a;
    --warning-soft: #fdf1dc;
    --critical: #d03b3b;
    --critical-soft: #fbe6e6;
    --grid: #e3e7ee;
    --axis: #c3c9d4;
    --shadow: 0 1px 2px rgba(20,30,50,0.06), 0 8px 24px -12px rgba(20,30,50,0.18);
    --font-ui: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", system-ui, sans-serif;
    --font-mono: "Consolas", "SF Mono", "Malgun Gothic", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --bg: #0d1218;
      --page-plane: #0a0e13;
      --surface: #141b24;
      --surface-2: #19212c;
      --surface-3: #1f2836;
      --border: #2a3442;
      --text: #e8edf4;
      --text-secondary: #a7b2c2;
      --text-muted: #718094;
      --accent: #7fa8e0;
      --accent-ink: #0a1622;
      --accent-soft: #1c2c42;
      --good: #34c759;
      --good-soft: #163420;
      --warning: #e8b84b;
      --warning-soft: #3a2e14;
      --critical: #ef5b5b;
      --critical-soft: #3a1c1c;
      --grid: #232d3a;
      --axis: #384454;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d1218;
    --page-plane: #0a0e13;
    --surface: #141b24;
    --surface-2: #19212c;
    --surface-3: #1f2836;
    --border: #2a3442;
    --text: #e8edf4;
    --text-secondary: #a7b2c2;
    --text-muted: #718094;
    --accent: #7fa8e0;
    --accent-ink: #0a1622;
    --accent-soft: #1c2c42;
    --good: #34c759;
    --good-soft: #163420;
    --warning: #e8b84b;
    --warning-soft: #3a2e14;
    --critical: #ef5b5b;
    --critical-soft: #3a1c1c;
    --grid: #232d3a;
    --axis: #384454;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }
  :root[data-theme="light"] {
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--page-plane);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  ::selection{ background: var(--accent-soft); }

  :root{ --topbar-h: 62px; }

  /* ---------- Top bar ---------- */
  .topbar{
    position: sticky; top: 0; z-index: 20;
    height: var(--topbar-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding: 0 22px;
  }
  .topbar-title{
    font-size: 18px; font-weight: 800; letter-spacing: -0.01em;
    display:flex; align-items:baseline; gap:10px; min-width:0;
  }
  .topbar-title .sub{ font-size: 11.5px; font-weight: 500; color: var(--text-muted); white-space:nowrap; }
  .topbar-actions{ display:flex; align-items:center; gap:10px; flex: none; }
  .upload-btn{
    background: var(--accent); color: var(--accent-ink); border: none;
    padding: 9px 16px; border-radius: 8px; font-weight: 700; font-size: 12.5px;
    cursor: pointer; display:inline-flex; align-items:center; gap:6px;
    font-family: var(--font-ui); white-space:nowrap;
  }
  .upload-btn:hover{ filter: brightness(1.08); }
  .upload-btn:active{ filter: brightness(0.96); }
  .upload-status{ font-size: 11px; color: var(--text-muted); max-width: 220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .std-pdf-row{ display:flex; align-items:center; gap:8px; margin: 8px 0 14px 0; flex-wrap:wrap; }
  .std-pdf-row .btn-secondary, .std-pdf-row .btn-cancel{ padding: 4px 11px; font-size: 11px; }
  .std-pdf-chip{
    font-size: 12px; color: var(--text); background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 10px; max-width: 360px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .std-pdf-size{ color: var(--text-muted); }
  .std-pdf-hint{ font-size: 11px; color: var(--text-muted); }
  #adminControls{ display:none; align-items:center; gap:10px; }
  body.admin-mode #adminControls{ display:flex; }
  #adminModeToggle{
    background: transparent; color: var(--text-muted); border: 1px solid var(--border);
    padding: 6px 10px; border-radius: 8px; font-size: 12px; cursor: pointer;
    font-family: var(--font-ui); white-space:nowrap; opacity: 0.55;
  }
  #adminModeToggle:hover{ opacity: 1; }
  body.admin-mode #adminModeToggle{ opacity: 1; background: var(--surface-2); color: var(--text); }
  @media (max-width: 760px){
    .topbar{ flex-wrap: wrap; height: auto; padding: 10px 16px; }
    .topbar-title{ flex-wrap:wrap; }
  }

  .app{
    display: grid;
    grid-template-columns: 272px 1fr;
    min-height: calc(100vh - var(--topbar-h));
  }
  @media (max-width: 760px){
    .app{ grid-template-columns: 1fr; }
    .sidebar{ position: static; max-height: none; border-right: none; border-bottom: 1px solid var(--border); }
    .main{ padding: 20px 16px 48px; }
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 20px 14px 28px;
    overflow-y: auto;
    max-height: calc(100vh - var(--topbar-h));
    position: sticky;
    top: var(--topbar-h);
  }
  .brand{
    padding: 4px 8px 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 14px;
  }
  .brand-title{
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .brand-sub{
    font-size: 11.5px;
    color: var(--text-muted);
    margin-top: 3px;
  }
  .nav-group{ margin-bottom: 4px; }
  .nav-group-title{
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 12px 8px 6px;
  }
  .nav-item{
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 8px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-secondary);
    border: 1px solid transparent;
  }
  .nav-item:hover{ background: var(--surface-2); color: var(--text); }
  .nav-item.active{
    background: var(--accent-soft);
    color: var(--text);
    border-color: color-mix(in srgb, var(--accent) 35%, transparent);
    font-weight: 600;
  }
  .nav-dot{
    width: 8px; height: 8px; border-radius: 50%;
    flex: none;
    background: var(--good);
  }
  .nav-dot.warning{ background: var(--warning); }
  .nav-dot.critical{ background: var(--critical); }
  .nav-item-label{ flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-home{
    display:flex; align-items:center; gap:8px;
    padding: 8px; margin: 10px 0 6px; border-radius: 7px; cursor:pointer;
    font-weight: 700; font-size: 13.5px; color: var(--text);
  }
  .nav-home:hover{ background: var(--surface-2); }
  .nav-home.active{ background: var(--accent-soft); }

  /* ---------- Main ---------- */
  .main{ padding: 26px 32px 60px; max-width: 1280px; }
  .topline{
    display:flex; align-items: baseline; justify-content: space-between; gap: 16px;
    margin-bottom: 22px; flex-wrap: wrap;
  }
  .page-title{ font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }
  .page-meta{ font-size: 12.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; }

  .kpi-row{
    display: grid;
    grid-template-columns: repeat(5, minmax(0,1fr));
    gap: 12px;
    margin-bottom: 26px;
  }
  .kpi{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }
  .kpi-label{ font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
  .kpi-value{ font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kpi.good .kpi-value{ color: var(--good); }
  .kpi.warning .kpi-value{ color: var(--warning); }
  .kpi.critical .kpi-value{ color: var(--critical); }

  .section-title{
    font-size: 13px; font-weight: 700; color: var(--text-secondary);
    margin: 26px 0 12px; text-transform: uppercase; letter-spacing: 0.04em;
  }

  .card-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 12px;
  }
  .unit-card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform .12s ease, border-color .12s ease;
  }
  .unit-card:hover{ transform: translateY(-2px); border-color: var(--accent); }
  .unit-card-top{ display:flex; align-items:flex-start; justify-content: space-between; gap: 8px; }
  .unit-card-group{ font-size: 10.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 3px;}
  .unit-card-label{ font-size: 14.5px; font-weight: 700; }
  .unit-card-db{ font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); margin-top: 2px; }
  .status-chip{
    display:inline-flex; align-items:center; gap:5px;
    font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    white-space: nowrap;
  }
  .status-chip.good{ background: var(--good-soft); color: var(--good); }
  .status-chip.warning{ background: var(--warning-soft); color: var(--warning); }
  .status-chip.critical{ background: var(--critical-soft); color: var(--critical); }
  .status-chip::before{ content:""; width:6px; height:6px; border-radius:50%; background: currentColor; }
  .unit-card-reason{
    margin-top: 10px; font-size: 12px; color: var(--text-secondary);
    padding-top: 10px; border-top: 1px solid var(--border);
  }
  .unit-card-reason b{ font-variant-numeric: tabular-nums; color: var(--text); }
  .unit-card-reason.empty{ color: var(--text-muted); }

  /* ---------- Main page (overview) ---------- */
  :root{ --main-grid-left: 400px; }
  .main-grid{
    display: grid;
    grid-template-columns: var(--main-grid-left) 12px 1fr;
    gap: 10px;
    align-items: start;
  }
  .grid-resizer{
    align-self: stretch;
    cursor: col-resize;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  .grid-resizer::before{
    content: ""; width: 3px; height: 100%; min-height: 200px; border-radius: 3px;
    background: var(--border); transition: background .12s ease, width .12s ease;
  }
  .grid-resizer:hover::before, .grid-resizer.dragging::before{ background: var(--accent); width: 4px; }
  @media (max-width: 1100px){
    .main-grid{ grid-template-columns: 1fr; }
    .grid-resizer{ display: none; }
  }

  .summary-panel{
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px 22px 22px; box-shadow: var(--shadow);
  }
  .summary-heading{ font-size: 15.5px; font-weight: 800; margin-bottom: 16px; display:flex; align-items:center; justify-content: space-between; gap:8px; }
  .panel-edit-btn{
    font-size: 11.5px; font-weight: 700; color: var(--accent); background: var(--accent-soft);
    border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); border-radius: 7px;
    padding: 4px 10px; cursor: pointer; font-family: var(--font-ui); flex: none;
  }
  .panel-edit-btn:hover{ filter: brightness(1.05); }
  .summary-custom-text{
    font-size: 12.5px; color: var(--text-secondary); white-space: pre-wrap; line-height: 1.6;
  }
  .summary-override-note{ font-size: 10.5px; color: var(--text-muted); margin-top: 10px; }
  .summary-override-note a{ color: var(--accent); cursor: pointer; text-decoration: none; }
  .summary-override-note a:hover{ text-decoration: underline; }
  .summary-textarea{
    width: 100%; min-height: 300px; resize: vertical; box-sizing: border-box;
    font-family: var(--font-ui); font-size: 12.5px; line-height: 1.6; color: var(--text);
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px;
  }
  .summary-edit-actions{ display:flex; gap: 8px; margin-top: 10px; }
  /* 서식 툴바 - 굵게(Ctrl+B) 버튼과 글자색 스와치. 분석결과요약 등 리치텍스트 편집에 공통 사용 */
  .fmt-toolbar{ display:flex; align-items:center; gap:6px; margin-bottom: 8px; flex-wrap: wrap; }
  .fmt-btn{
    font-size: 12.5px; font-weight: 700; border-radius: 6px; padding: 5px 10px; cursor: pointer;
    font-family: var(--font-ui); border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
  }
  .fmt-btn:hover{ background: var(--surface-3); }
  .fmt-btn.active{ background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .fmt-sep{ width:1px; height:20px; background: var(--border); margin: 0 2px; }
  .fmt-color-swatch{
    width: 20px; height: 20px; border-radius: 5px; cursor: pointer; border: 1px solid var(--border);
    padding: 0;
  }
  .fmt-color-swatch:hover{ transform: scale(1.08); }
  .fmt-color-swatch.fmt-color-default{
    background: var(--surface); position:relative;
  }
  .fmt-color-swatch.fmt-color-default::after{
    content:''; position:absolute; left:2px; right:2px; top:50%; height:2px; background:#e5322d;
    transform: rotate(45deg);
  }
  .fmt-color-picker{
    width: 24px; height: 24px; border: 1px solid var(--border); border-radius: 5px; padding: 0; cursor: pointer;
    background: none;
  }
  .summary-editable{
    width: 100%; min-height: 300px; box-sizing: border-box; overflow-y: auto;
    font-family: var(--font-ui); font-size: 12.5px; line-height: 1.6; color: var(--text);
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; white-space: pre-wrap;
  }
  .summary-editable:focus{ outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: -1px; }
  .btn-save, .btn-cancel{
    font-size: 12px; font-weight: 700; border-radius: 7px; padding: 7px 14px; cursor: pointer;
    font-family: var(--font-ui); border: 1px solid transparent;
  }
  .btn-save{ background: var(--accent); color: var(--accent-ink); }
  .btn-save:hover{ filter: brightness(1.08); }
  .btn-cancel{ background: var(--surface-2); color: var(--text-secondary); border-color: var(--border); }
  .btn-cancel:hover{ background: var(--surface-3); }
  .summary-block{ margin-bottom: 20px; }
  .summary-block:last-child{ margin-bottom: 0; }
  .summary-block-title{ font-size: 13px; font-weight: 700; margin-bottom: 9px; color: var(--text); }
  .summary-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px; }
  .summary-list li{ font-size: 12.5px; color: var(--text-secondary); padding-left: 13px; position: relative; line-height: 1.55; }
  .summary-list li::before{ content:'-'; position:absolute; left:0; top:0; color: var(--text-muted); }
  .summary-list li b{ color: var(--text); font-variant-numeric: tabular-nums; }
  .summary-list li .sev{ font-weight:700; }
  .summary-list li .sev.warning{ color: var(--warning); }
  .summary-list li .sev.critical{ color: var(--critical); }
  /* 추세 조기경보 - 절대 기준치(빨강/노랑)와 다른 축의 신호라는 걸 보여주기 위해 보라 계열을 쓴다 */
  .trend-note{ color: #6b4fbb; font-weight: 600; }
  .trend-badge{
    display:inline-flex; align-items:center; justify-content:center; font-size:10px;
    background:#efe9fb; border-radius:999px; width:16px; height:16px; margin-left:3px;
    vertical-align:middle; cursor:help;
  }
  .kpi.trend .kpi-value{ color:#6b4fbb; }
  /* "현재 상태"와는 별개 카드로 분리된 추세 조기경보 - 제목 1줄 + 내용 1줄 */
  .trend-card{ background: #f6f2ff; border-color: #d9cdf5 !important; }
  .trend-panel-title{ font-size: 12.5px; font-weight: 700; color:#5b3fae; }
  .trend-panel-title .th-note{ font-weight: 400; }
  .trend-panel-detail{ font-size: 12.5px; color:#3d2d78; line-height:1.6; margin-top: 5px; }
  .plan-note{ font-size: 12.3px; color: var(--text-secondary); white-space: pre-line; line-height: 1.6; }
  .unit-note-highlight{
    display:inline-block; font-weight:700; font-size:13.5px; padding:8px 14px; border-radius:6px;
    line-height:1.5; background: var(--surface-2); color: var(--text);
  }
  .unit-note-highlight.warning{ background:#ffd400; color:#1a1200; }
  .unit-note-highlight.critical{ background:#e5322d; color:#ffffff; }
  .plan-caption{ font-size: 10.5px; color: var(--text-muted); margin-top: 7px; }
  .mini-chart-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom: 8px; }
  .mini-chart-select{
    font-size: 11.5px; font-family: var(--font-ui); color: var(--text); background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px;
  }

  .table-panel{
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 14px 16px; box-shadow: var(--shadow); overflow-x: auto; min-width: 0;
  }
  .table-heading{ font-size: 15.5px; font-weight: 800; }
  .table-heading-row{ display:flex; align-items:center; justify-content: space-between; gap: 12px; margin: 0 4px 14px; flex-wrap: wrap; }
  .thresh-input{
    width: 100%; font-family: var(--font-mono); font-size: 10.5px; text-align: right;
    background: var(--surface); border: 1px solid var(--border); border-radius: 5px; padding: 3px 4px; color: var(--text);
    box-sizing: border-box;
  }
  /* table-layout:fixed 열 너비는 반드시 <colgroup>으로 지정한다 - 임계값 행은 colspan을 쓰므로
     nth-child로 폭을 주면 행마다 셀 개수가 달라져 엉뚱한 열에 폭이 적용된다(예전 버그). */
  table.main-table{ width: 100%; border-collapse: collapse; font-size: 11.3px; table-layout: fixed; font-variant-numeric: tabular-nums; }
  table.main-table th, table.main-table td{
    padding: 6px 5px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap;
  }
  table.main-table th.left, table.main-table td.left{ text-align: left; }
  table.main-table thead th{
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.01em; color: var(--text-muted);
    font-weight: 700; background: var(--surface); position: sticky; top: 0;
  }
  tr.thresh-row td, tr.thresh-row th{
    font-size: 11.5px; font-family: var(--font-mono); font-weight: 700;
    padding-top: 5px; padding-bottom: 5px;
  }
  tr.thresh-row th{ text-align: right; }
  tr.thresh-row.alarm td, tr.thresh-row.alarm th{ background: var(--surface-2); color: #e5322d; }
  tr.thresh-row.caution td, tr.thresh-row.caution th{ background: var(--surface-2); color: #b5860a; }
  tr.table-row{ cursor: pointer; }
  tr.table-row:hover td{ background: var(--surface-2); }
  td.cell-warning{ background: var(--warning-soft); color: var(--warning); font-weight: 700; border-radius: 4px; }
  td.cell-critical{ background: var(--critical-soft); color: var(--critical); font-weight: 700; border-radius: 4px; }
  .main-row-name{ font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .main-row-dbname{ font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- Detail view ---------- */
  .detail-header{
    display:flex; align-items:flex-start; justify-content: space-between; gap:16px; flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .detail-title{ font-size: 22px; font-weight: 700; }

  'Main T/R #90':       {group: '복합 7,8,9호기 주변압기', label: '복합 9호기 주변압기'},
  'Aux T/R #80':        {group: '복합 7,8,9호기 보조변압기', label: '복합 8호기 보조변압기'},
  'Aux T/R #90':        {group: '복합 7,8,9호기 보조변압기', label: '복합 9호기 보조변압기'},
};
const GROUP_ORDER = [
  '복합 3,4호기 G/T 주변압기', '복합 3,4호기 보조변압기', '복합 3,4호기 S/T 변압기',
  '복합 5,6호기 G/T 주변압기', '복합 5,6호기 S/T 주변압기', '복합 5,6호기 보조변압기',
  '복합 7,8,9호기 주변압기', '복합 7,8,9호기 보조변압기', '기타 설비',
];

// 사용하지 않는 설비는 대시보드 전체(사이드바/표/요약/KPI)에서 완전히 제외한다.
const EXCLUDED_DB_NAMES = new Set(['S/T Aux T/R #1-2']);
function excludeUnusedUnits(units){
  return units.filter(u => !EXCLUDED_DB_NAMES.has(u.db_name));
}

// rows: 시트를 그대로 옮긴 2차원 배열(0-indexed, A열=index 0). 최초 로드/업로드 파싱 결과 모두 이 함수를 거친다.
function buildModel(rows){
  const header = rows[0] || [];
  const dateCols = [];
  for (let c = 6; c < header.length; c++){
    const v = header[c];
    if (typeof v === 'number' && v > 20000 && v < 80000){
      dateCols.push({col: c, iso: serialToISODate(v)});
    }
  }
  const units = [];
  for (let r = 1; r < rows.length; r++){
    const row = rows[r] || [];
    const no = row[0];
    const name = row[1];
    if (typeof no === 'number' && typeof name === 'string' && name.trim()){
      const gases = {};
      for (const [off, code, kor] of GAS_OFFSETS){
        const gr = rows[r + off] || [];
        const caution = typeof gr[3] === 'number' ? gr[3] : null;
        const alarm = typeof gr[4] === 'number' ? gr[4] : null;
        const base = typeof gr[5] === 'number' ? gr[5] : null;
        const series = [];
        for (const dc of dateCols){
          const v = gr[dc.col];
          if (typeof v === 'number') series.push({d: dc.iso, v: Math.round(v * 1000) / 1000});
        }
        gases[code] = {name_kor: kor, caution, alarm, base, series};
      }
      units.push({no, db_name: name.trim(), excel_row: r + 1, gases});
    }
  }
  return units;
}

function decorateUnits(rawUnits){
  return rawUnits.map(u => {
    const meta = LABEL_MAP[u.db_name];
    return {...u, group: meta ? meta.group : '기타 설비', label: meta ? meta.label : u.db_name};
  });
}

function latestDateOf(units){
  let max = null;
  units.forEach(u => Object.values(u.gases).forEach(g => g.series.forEach(p => {
    if (!max || p.d > max) max = p.d;
  })));
  return max;
}

// 단일 변압기의 실제 최종 측정일 (모든 측정성분 통틀어 가장 최근 날짜)
function unitLatestDate(unit){
  let max = null;
  Object.values(unit.gases).forEach(g => g.series.forEach(p => { if (!max || p.d > max) max = p.d; }));
  return max;
}

// 데이터 기준일 안내 배지: 전체 최신일과 다르면(=이 변압기가 최근 측정에서 빠짐) 눈에 띄게 표시
function dataAsOfHtml(unit){
  const d = unitLatestDate(unit);
  if (!d) return `<span class="th-note">측정 데이터 없음</span>`;
  if (d === REPORT_DATE) return `<span class="th-note">데이터 기준일: ${d}</span>`;
  return `<span class="stale-note">⚠ 데이터 기준일: ${d} (전체 최신 ${REPORT_DATE}보다 오래됨 — 이후 측정 기록 없음)</span>`;
}

/* ---- 이상/요주의 기준값 수정 기능 (localStorage에 저장, 이 브라우저에만 유지) ----
   BASE_UNITS는 현재 로드된 원본(DB 기본값) 데이터, DATA는 여기에 사용자가 수정한 기준값을
   덧씌운 화면 표시용 데이터다. 기준값을 수정/초기화할 때는 BASE_UNITS로부터 다시 계산하므로
   DB 원본값이 훼손되지 않는다. */
const THRESH_LS_KEY = 'dga_dashboard_threshold_override_v1';
function getThresholdOverrides(){ try { return JSON.parse(localStorage.getItem(THRESH_LS_KEY) || '{}'); } catch(e){ return {}; } }
function setThresholdOverrides(obj){ try { localStorage.setItem(THRESH_LS_KEY, JSON.stringify(obj)); } catch(e){} }
function clearThresholdOverrides(){ try { localStorage.removeItem(THRESH_LS_KEY); } catch(e){} }
function applyThresholdOverrides(units){
  const overrides = getThresholdOverrides();
  if(!Object.keys(overrides).length) return units;
  return units.map(u=>{
    const gases = {...u.gases};
    Object.entries(overrides).forEach(([code, ov])=>{
      if(gases[code]){
        gases[code] = {
          ...gases[code],
          caution: ov.caution != null ? ov.caution : gases[code].caution,
          alarm: ov.alarm != null ? ov.alarm : gases[code].alarm,
          base: ov.base != null ? ov.base : gases[code].base,
        };
      }
    });
    return {...u, gases};
  });
}
function rebuildData(){ DATA = applyThresholdOverrides(BASE_UNITS); }

/* ---- 마지막으로 업로드한 엑셀을 저장해서, 다시 열어도 최신 업로드 기준으로 시작하게 한다 ----
   내장된 RAW_ROWS는 "초기값"으로만 남겨두고, 실제 시작 데이터는 localStorage에 저장된
   마지막 업로드가 있으면 그걸 우선 쓴다. 업로드할 때마다 여기 갱신되고, "초기 데이터로 되돌리기"로
   언제든 원래 내장 데이터로 되돌릴 수 있다. */
const UPLOADED_ROWS_LS_KEY = 'dga_uploaded_raw_rows_v1';
const UPLOADED_FILENAME_LS_KEY = 'dga_uploaded_filename_v1';
function getUploadedRows(){
  try {
    const saved = localStorage.getItem(UPLOADED_ROWS_LS_KEY);
    return saved ? JSON.parse(saved) : null;
  } catch(e){ return null; }
}
function saveUploadedRows(rows, filename){
  try {
    localStorage.setItem(UPLOADED_ROWS_LS_KEY, JSON.stringify(rows));
    localStorage.setItem(UPLOADED_FILENAME_LS_KEY, filename);
  } catch(e){ console.warn('업로드 데이터를 저장하지 못했습니다(저장 공간 부족 등):', e); }
}
function clearUploadedRows(){
  try { localStorage.removeItem(UPLOADED_ROWS_LS_KEY); localStorage.removeItem(UPLOADED_FILENAME_LS_KEY); } catch(e){}
}

const uploadedRowsAtStart = getUploadedRows();
let BASE_UNITS = excludeUnusedUnits(decorateUnits(buildModel(uploadedRowsAtStart || RAW_ROWS)));
let DATA = applyThresholdOverrides(BASE_UNITS);
let REPORT_DATE = latestDateOf(DATA) || '—';
let DATA_SOURCE_LABEL = uploadedRowsAtStart
  ? '업로드한 파일: ' + (localStorage.getItem(UPLOADED_FILENAME_LS_KEY) || '(파일명 미상)') + ' (저장된 최신 업로드)'
  : '초기 제공 데이터베이스(유중가스분석 Database.xlsx)';

// 지금 화면에 반영된 원본 행 데이터(RAW_ROWS와 같은 형태). "공유용 data.json 내보내기" 버튼이
// 이 값을 그대로 파일로 저장한다 - 로그인 없는 정적 페이지(GitHub Pages)에서는 서버에 직접 쓸 수
// 없으므로, 이 파일을 받아 저장소에 올려야 다른 사람 화면에도 반영된다.
let CURRENT_RAW_ROWS = uploadedRowsAtStart || RAW_ROWS;

/* =========================================================================
   공유 데이터 동기화 (data.json) - 로그인이 필요한 백엔드 없이, 이 페이지와 같은 위치에
   놓인 data.json 파일을 "공유 데이터베이스" 대신으로 쓴다.
     1) 페이지를 열 때마다 data.json을 가져와, 있으면 내장된 RAW_ROWS보다 우선 반영한다.
        (data.json이 없거나 실패하면 조용히 무시하고 지금처럼 동작한다.)
     2) 페이지가 열려 있는 동안에도 몇 분마다 다시 가져와, 다른 사람이 새 data.json을
        올리면 새로고침 없이 화면이 갱신되게 한다.
     3) "엑셀 업로드"는 여전히 이 브라우저에만 미리보기로 반영된다 - 모두에게 반영하려면
        아래 "공유용 data.json 내보내기"로 파일을 받아, 그 파일로 저장소의 data.json을
        덮어써야 한다(예: GitHub 저장소 페이지에서 드래그 앤 드롭으로 교체 후 커밋). */
const SHARED_DATA_URL = 'data.json';

async function fetchServerData(){
  try {
    const res = await fetch(SHARED_DATA_URL, {cache: 'no-store'});
    if(!res.ok) return null;
    const rows = await res.json();
    if(!Array.isArray(rows) || !rows.length) return null;
    return { rows, meta: { filename: SHARED_DATA_URL } };
  } catch(e){
    return null; // data.json이 없거나(로컬 파일로 직접 열어본 경우 등) 네트워크 오류 - 조용히 무시
  }
}

async function syncFromServerAndRender(){
  const server = await fetchServerData();
  if(!server) return;
  try {
    const units = excludeUnusedUnits(decorateUnits(buildModel(server.rows)));
    if(!units.length) return;
    CURRENT_RAW_ROWS = server.rows;
    BASE_UNITS = units;
    rebuildData();
    REPORT_DATE = latestDateOf(DATA) || '—';
    DATA_SOURCE_LABEL = '공유 데이터(data.json) 기준 최신 데이터';
    render();
  } catch(e){
    console.warn('공유 데이터(data.json) 반영 중 오류:', e);
  }
}

// 5분마다 조용히 다시 확인해서, 다른 사람이 새 data.json을 올리면 새로고침 없이도 반영한다.
function startSharedDataPolling(){
  setInterval(syncFromServerAndRender, 5 * 60 * 1000);
}

// 지금 화면에 반영돼 있는 데이터를 data.json 형식 그대로 파일로 내려받는다.
// 이 파일로 저장소(GitHub 등)의 data.json을 교체하면 모든 사람에게 반영된다.
function exportSharedDataJson(){
  const json = JSON.stringify(CURRENT_RAW_ROWS);
  const blob = new Blob([json], {type: 'application/json'});
  downloadBlob(blob, 'data.json');
  setUploadStatus('data.json을 내려받았습니다 — 이 파일로 저장소의 data.json을 교체(커밋)하면 모든 사람에게 반영됩니다.', false);
}

/* =========================================================================
   GitHub 자동 반영 - 이 관리자 페이지(admin.html)에서만 쓴다. 공개 대시보드
   (index.html)에는 이 코드가 없다. GitHub Personal Access Token을 이 브라우저의
   localStorage에만 저장해두고, "모두에게 반영"을 누르면 GitHub REST API(Contents API)로
   저장소의 data.json 파일을 직접 갱신(커밋)한다. 그러면 GitHub Pages가 1분 이내에
   자동으로 다시 배포하고, 공개 대시보드를 보고 있던 사람도 5분 폴링(또는 새로고침)으로
   최신 데이터를 보게 된다. */
const GH_SETTINGS_LS_KEY = 'dga_github_publish_settings_v1';
function getGithubSettings(){

}

}

// 문자열(한글 포함)을 GitHub API가 요구하는 base64로 안전하게 인코딩한다 (btoa는 UTF-8을 직접 지원하지 않음).
function utf8ToBase64(str){
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary);
}

async function publishToGithub(){
  const settings = getGithubSettings();
  if (!settings){
    setUploadStatus('먼저 "⚙ GitHub 연결 설정"에서 저장소 정보와 토큰을 입력해주세요.', true);
    openGithubSettingsPanel();
    return;
  }
  const {owner, repo, branch, token} = settings;
  const path = 'data.json';
  const apiUrl = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/${path}`;
  const headers = {
    'Authorization': 'Bearer ' + token,
    'Accept': 'application/vnd.github+json',
  };
  try {
    setUploadStatus('GitHub에 반영하는 중...', false);
    // 1) 기존 파일의 sha를 조회한다 (없으면 새로 만든다).
    let sha;
    const getRes = await fetch(apiUrl + '?ref=' + encodeURIComponent(branch), {headers});
    if (getRes.ok){
      const getData = await getRes.json();
      sha = getData.sha;
    } else if (getRes.status !== 404){
      const errText = await getRes.text();
      throw new Error('저장소 조회 실패 (' + getRes.status + '): ' + errText.slice(0,200));
    }
    // 2) 지금 화면의 데이터를 data.json 내용으로 커밋한다.
    const content = utf8ToBase64(JSON.stringify(CURRENT_RAW_ROWS));
    const dateTag = new Date().toISOString().slice(0,16).replace('T',' ');
    const putRes = await fetch(apiUrl, {
      method: 'PUT',
      headers: {...headers, 'Content-Type': 'application/json'},
      body: JSON.stringify({
        message: 'data.json 업데이트 (' + dateTag + ')',
        content,
        branch,
        ...(sha ? {sha} : {}),
      }),
    });
    if (!putRes.ok){
      const errText = await putRes.text();
      throw new Error('저장 실패 (' + putRes.status + '): ' + errText.slice(0,300));
    }
    setUploadStatus('✓ GitHub에 반영 완료 — 1분 정도 후면 대시보드 링크를 보는 모든 사람에게 자동으로 나타납니다.', false);
  } catch(err){
    console.error(err);
    setUploadStatus('GitHub 반영 실패: ' + err.message + ' (토큰 권한/만료 여부를 확인해주세요. 대신 "⭳ 파일로 내려받기"로 수동 업로드할 수 있습니다.)', true);
  }
}

/* 좌/우 패널 비율(드래그 구분선)을 브라우저에 저장해 다음에 열 때도 유지한다. */
const GRID_LEFT_LS_KEY = 'dga_dashboard_grid_left_v1';
(function restoreGridLeft(){
  try {
    const saved = localStorage.getItem(GRID_LEFT_LS_KEY);
    if(saved) document.documentElement.style.setProperty('--main-grid-left', saved);
  } catch(e){}
})();
function setupGridResizer(){
  const resizer = document.getElementById('mainGridResizer');
  const grid = document.querySelector('.main-grid');
  if(!resizer || !grid) return;
  const MIN_LEFT = 280, MIN_RIGHT = 500, RESIZER_W = 12;
  let dragging = false;
  const onMove = (e)=>{
    if(!dragging) return;
    const rect = grid.getBoundingClientRect();
    const maxLeft = rect.width - MIN_RIGHT - RESIZER_W;
    let left = Math.max(MIN_LEFT, Math.min(e.clientX - rect.left, maxLeft));
    document.documentElement.style.setProperty('--main-grid-left', left + 'px');
  };
  const onUp = ()=>{
    if(!dragging) return;
    dragging = false;
    resizer.classList.remove('dragging');
    document.body.style.userSelect = '';
    try { localStorage.setItem(GRID_LEFT_LS_KEY, document.documentElement.style.getPropertyValue('--main-grid-left')); } catch(e){}
  };
  resizer.addEventListener('mousedown', (e)=>{
    dragging = true;
    resizer.classList.add('dragging');
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  resizer.addEventListener('dblclick', ()=>{
    document.documentElement.style.setProperty('--main-grid-left', '400px');
    try { localStorage.setItem(GRID_LEFT_LS_KEY, '400px'); } catch(e){}
  });
}

/* =========================================================================
   2) 엑셀(.xlsx) 업로드 - 브라우저 내에서 직접 ZIP 해제 + XML 파싱
      xlsx는 ZIP(OOXML) 포맷이므로 외부 라이브러리 없이
      DecompressionStream('deflate-raw') + DOMParser 로 필요한 부분만 읽는다.
   ========================================================================= */
async function inflateRaw(bytes){
  if (typeof DecompressionStream === 'undefined'){
    throw new Error('이 브라우저는 압축 해제 API(DecompressionStream)를 지원하지 않습니다. 최신 Chrome/Edge에서 열어주세요.');
  }
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function openZip(buf){
  const view = new DataView(buf);
  const u8 = new Uint8Array(buf);
  let eocd = -1;
  const scanFrom = Math.max(0, u8.length - 22 - 65557);
  for (let i = u8.length - 22; i >= scanFrom; i--){
    if (view.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if (eocd < 0) throw new Error('올바른 xlsx(zip) 파일이 아닙니다.');
  const cdCount = view.getUint16(eocd + 10, true);
  const cdOffset = view.getUint32(eocd + 16, true);
  const dec = new TextDecoder('utf-8');
  const entries = new Map();
  let p = cdOffset;
  for (let i = 0; i < cdCount; i++){
    if (view.getUint32(p, true) !== 0x02014b50) throw new Error('ZIP 중앙 디렉터리 파싱 오류');
    const compMethod = view.getUint16(p + 10, true);
    const compSize = view.getUint32(p + 20, true);
    const nameLen = view.getUint16(p + 28, true);
    const extraLen = view.getUint16(p + 30, true);
    const commentLen = view.getUint16(p + 32, true);
    const localHeaderOffset = view.getUint32(p + 42, true);
    const name = dec.decode(u8.slice(p + 46, p + 46 + nameLen));
    entries.set(name, {localHeaderOffset, compMethod, compSize});
    p += 46 + nameLen + extraLen + commentLen;
  }
  async function getFile(name){
    const meta = entries.get(name);
    if (!meta) return null;
    const lp = meta.localHeaderOffset;
    if (view.getUint32(lp, true) !== 0x04034b50) throw new Error('ZIP 로컬 헤더 파싱 오류: ' + name);
    const lNameLen = view.getUint16(lp + 26, true);
    const lExtraLen = view.getUint16(lp + 28, true);
    const dataStart = lp + 30 + lNameLen + lExtraLen;
    const compData = u8.slice(dataStart, dataStart + meta.compSize);
    if (meta.compMethod === 0) return compData;
    if (meta.compMethod === 8) return await inflateRaw(compData);
    throw new Error('지원하지 않는 압축 방식(' + meta.compMethod + '): ' + name);
  }
  return {entries, getFile};
}

function colRefToIndex(ref){
  const m = /^([A-Z]+)/.exec(ref);
  let idx = 0;
  for (const ch of m[1]) idx = idx * 26 + (ch.charCodeAt(0) - 64);
  return idx - 1;
}

function parseSharedStrings(xmlText){
  if (!xmlText) return [];
  const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
  const sis = doc.getElementsByTagName('si');
  const out = [];
  for (const si of sis){
    let text = '';
    for (const t of si.getElementsByTagName('t')) text += t.textContent;
    out.push(text);
  }
  return out;
}

function parseSheetToRows(xmlText, sharedStrings){
  const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length){
    throw new Error('시트 XML 파싱 오류');
  }
  const rowEls = doc.getElementsByTagName('row');
  const rows = [];
  for (const rowEl of rowEls){
    const rIdx = parseInt(rowEl.getAttribute('r'), 10) - 1;
    const rowArr = [];
    for (const c of rowEl.getElementsByTagName('c')){
      const ref = c.getAttribute('r');
      if (!ref) continue;
      const colIdx = colRefToIndex(ref);
      const type = c.getAttribute('t');
      let val = null;
      if (type === 's'){
        const vEl = c.getElementsByTagName('v')[0];
        val = vEl ? (sharedStrings[parseInt(vEl.textContent, 10)] ?? null) : null;
      } else if (type === 'inlineStr'){
        const isEl = c.getElementsByTagName('is')[0];
        val = isEl ? isEl.textContent : null;
      } else if (type === 'str' || type === 'b'){
        const vEl = c.getElementsByTagName('v')[0];
        val = vEl ? vEl.textContent : null;
      } else {
        const vEl = c.getElementsByTagName('v')[0];
        val = vEl && vEl.textContent !== '' ? parseFloat(vEl.textContent) : null;
      }
      while (rowArr.length < colIdx) rowArr.push(null);
      rowArr[colIdx] = val;
    }
    while (rows.length < rIdx) rows.push([]);
    rows[rIdx] = rowArr;
  }
  return rows;
}

function joinZipPath(base, target){
  if (target.startsWith('/')) return target.slice(1);
  const parts = base.split('/'); parts.pop();
  for (const seg of target.split('/')){
    if (seg === '..') parts.pop();
    else if (seg === '.' || seg === '') continue;
    else parts.push(seg);
  }
  return parts.join('/');
}

async function rowsFromXlsxArrayBuffer(buf){
  const zip = await openZip(buf);
  const dec = new TextDecoder('utf-8');
  const workbookXml = dec.decode(await zip.getFile('xl/workbook.xml') || new Uint8Array());
  const relsXml = dec.decode(await zip.getFile('xl/_rels/workbook.xml.rels') || new Uint8Array());
  if (!workbookXml) throw new Error('xl/workbook.xml을 찾을 수 없습니다. 올바른 xlsx 파일인지 확인해주세요.');
  const wbDoc = new DOMParser().parseFromString(workbookXml, 'application/xml');
  const relsDoc = new DOMParser().parseFromString(relsXml, 'application/xml');
  const firstSheet = wbDoc.getElementsByTagName('sheet')[0];
  if (!firstSheet) throw new Error('시트를 찾을 수 없습니다.');
  const rId = firstSheet.getAttribute('r:id') || firstSheet.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
  let sheetPath = 'xl/worksheets/sheet1.xml';
  for (const rel of relsDoc.getElementsByTagName('Relationship')){
    if (rel.getAttribute('Id') === rId){
      sheetPath = joinZipPath('xl/workbook.xml', rel.getAttribute('Target'));
      break;
    }
  }
  const sharedStringsBytes = await zip.getFile('xl/sharedStrings.xml');
  const sharedStrings = sharedStringsBytes ? parseSharedStrings(dec.decode(sharedStringsBytes)) : [];
  const sheetBytes = await zip.getFile(sheetPath);
  if (!sheetBytes) throw new Error('워크시트 XML(' + sheetPath + ')을 찾을 수 없습니다.');
  return parseSheetToRows(dec.decode(sheetBytes), sharedStrings);
}

/* =========================================================================
   3) 엑셀(.xlsx) 다운로드 - 브라우저 내에서 직접 ZIP(OOXML) 생성
      업로드 때와 마찬가지로 외부 라이브러리 없이, 압축 없는(STORE) ZIP + 최소한의
      OOXML 파트(worksheet 하나짜리)를 조립해 다시 업로드 가능한 xlsx로 내보낸다.
   ========================================================================= */
const ZIP_CRC_TABLE = (()=>{
  const table = new Uint32Array(256);
  for (let n = 0; n < 256; n++){
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    table[n] = c >>> 0;
  }
  return table;
})();
function crc32(bytes){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = ZIP_CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

// files: [{name, data:Uint8Array}] - 전부 압축 없이(STORE) 저장한다. 파일 몇 개짜리 소용량
// xlsx라 압축 없이도 문제 없고, 압축 스트림 구현 없이 안전하게 만들 수 있다.
function buildZipBlob(files){
  const enc = new TextEncoder();
  const localParts = [], centralParts = [];
  let offset = 0;
  files.forEach(f=>{
    const nameBytes = enc.encode(f.name);
    const crc = crc32(f.data);
    const size = f.data.length;
    const local = new Uint8Array(30 + nameBytes.length + size);
    const lv = new DataView(local.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, 20, true);   // version needed
    lv.setUint16(6, 0, true);    // flags
    lv.setUint16(8, 0, true);    // method: store
    lv.setUint16(10, 0, true);   // mod time
    lv.setUint16(12, 0x21, true); // mod date (임의 고정값)
    lv.setUint32(14, crc, true);
    lv.setUint32(18, size, true); // compressed size
    lv.setUint32(22, size, true); // uncompressed size
    lv.setUint16(26, nameBytes.length, true);
    lv.setUint16(28, 0, true);   // extra length
    local.set(nameBytes, 30);
    local.set(f.data, 30 + nameBytes.length);
    localParts.push(local);

    const central = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(central.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);   // version made by
    cv.setUint16(6, 20, true);   // version needed
    cv.setUint16(8, 0, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, 0, true);
    cv.setUint16(14, 0x21, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, size, true);
    cv.setUint32(24, size, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true);
    cv.setUint16(36, 0, true);
    cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    central.set(nameBytes, 46);
    centralParts.push(central);

    offset += local.length;
  });
  const centralOffset = offset;
  const centralSize = centralParts.reduce((s,p)=>s+p.length, 0);
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, centralSize, true);
  ev.setUint32(16, centralOffset, true);
  return new Blob([...localParts, ...centralParts, eocd], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

function xmlEscape(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
}

// rows: 2차원 배열. 문자열 셀은 inlineStr로, 숫자 셀은 값 그대로, null/undefined는 빈 칸으로 둔다.
function buildXlsxBlob(rows){
  const enc = new TextEncoder();
  let sheetRows = '';
  rows.forEach((row, ri)=>{
    let cells = '';
    row.forEach((val, ci)=>{
      if (val === null || val === undefined || val === '') return;
      const ref = String.fromCharCode(65 + ci) + (ri + 1);
      if (typeof val === 'number'){
        cells += `<c r="${ref}"><v>${val}</v></c>`;
      } else {
        cells += `<c r="${ref}" t="inlineStr"><is><t>${xmlEscape(val)}</t></is></c>`;
      }
    });
    sheetRows += `<row r="${ri+1}">${cells}</row>`;
  });
  const sheetXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${sheetRows}</sheetData></worksheet>`;
  const workbookXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="기준" sheetId="1" r:id="rId1"/></sheets></workbook>`;
  const workbookRelsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>`;
  const rootRelsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
  const contentTypesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>`;

  return buildZipBlob([
    {name:'[Content_Types].xml', data:enc.encode(contentTypesXml)},
    {name:'_rels/.rels', data:enc.encode(rootRelsXml)},
    {name:'xl/workbook.xml', data:enc.encode(workbookXml)},
    {name:'xl/_rels/workbook.xml.rels', data:enc.encode(workbookRelsXml)},
    {name:'xl/worksheets/sheet1.xml', data:enc.encode(sheetXml)},
  ]);
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();

  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

      if (!units.length) throw new Error('시트에서 변압기 데이터를 찾지 못했습니다. 기존 DB와 동일한 형식(A열 No / B열 변압기명 / D,E,F열 요주의,이상,기준 / G열부터 측정일자)인지 확인해주세요.');

// PPT 판정 방식과 동일하게 용존가스 성분(+TDCG)만으로 상태를 판정한다. 전산가/내전압/수분측정은 유질(오일) 항목이라 상세표에만 표시한다.
const STATUS_GASES = ['H2','CH4','CO','CO2','C2H4','C2H6','C2H2','C3H8','TDCG'];

// 배열 순서에 의존하지 않고 날짜(d) 기준으로 실제 가장 최근 측정값을 찾는다.
// 엑셀 업로드 시 열이 항상 시간순으로 맨 뒤에 추가된다는 가정이 깨져도 "최신값"이 항상 맞도록 하기 위함.
function lastPoint(series){
  if(!series || !series.length) return null;
  let best = series[0];
  for(const p of series) if(p.d > best.d) best = p;
  return best;
}

function gasStatus(code, gasObj){
  const meta = GAS_META[code];
  const lp = lastPoint(gasObj.series);
  if(!lp || gasObj.caution==null || gasObj.alarm==null) return {status:'nodata', value: lp?lp.v:null};
  const v = lp.v;
  if(meta.reversed){
    if(v < gasObj.alarm) return {status:'critical', value:v};
    return {status:'good', value:v};
  }
  if(v >= gasObj.alarm) return {status:'critical', value:v};
  if(v >= gasObj.caution) return {status:'warning', value:v};
  return {status:'good', value:v};
}

function unitStatus(unit){
  let worst = 'good';
  let reasons = [];
  for(const code of STATUS_GASES){
    const g = unit.gases[code];
    if(!g) continue;
    const r = gasStatus(code, g);
    if(r.status === 'critical' || r.status === 'warning'){
      reasons.push({code, value:r.value, status:r.status, caution:g.caution, alarm:g.alarm});
    }
    if(r.status === 'critical') worst = 'critical';
    else if(r.status === 'warning' && worst !== 'critical') worst = 'warning';
  }
  reasons.sort((a,b)=>{
    const rank = {critical:2, warning:1};
    if(rank[a.status] !== rank[b.status]) return rank[b.status]-rank[a.status];
    return (b.value/(b.alarm||b.caution||1)) - (a.value/(a.alarm||a.caution||1));
  });
  return {status: worst, reasons};
}

function statusLabel(s){ return s==='critical' ? '이상' : s==='warning' ? '요주의' : '양호'; }

/* =========================================================================
   추세 기반 조기 경보 - 절대 기준치(이상/요주의)와는 별도의 신호다.
   "최근 90일 대비 30% 이상 증가"를 기본값으로 하되, 값이 너무 작을 때(요주의 기준의
   25% 미만) 생기는 무의미한 %증가(예: 1ppm→3ppm=+200%)는 오탐으로 보고 무시한다.
   ========================================================================= */
const TREND_WINDOW_DAYS = 90;
const TREND_PCT_THRESHOLD = 30;
// 절대값 바닥: 요주의 기준의 이 비율(%) 이상이어야 조기경보 대상이 된다(작은 값의 무의미한
// 증가율 오탐 방지). 두 조건(증가율 + 절대값 바닥)을 모두 만족해야 신호가 뜬다.
const TREND_ABS_FLOOR_PCT = 25;

function addDaysISO(iso, days){
  const d = new Date(iso + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0, 10);
}

function gasTrend(gasObj){
  const series = gasObj.series;
  if(!series || series.length < 2) return null;
  const latest = lastPoint(series);
  if(!latest) return null;
  const cutoff = addDaysISO(latest.d, -TREND_WINDOW_DAYS);
  const past = series.filter(p=>p.d <= cutoff).sort((a,b)=> b.d.localeCompare(a.d))[0];
  if(!past || past.v <= 0) return null;
  const floor = gasObj.caution != null ? gasObj.caution * (TREND_ABS_FLOOR_PCT / 100) : 0;
  if(latest.v < floor) return null;
  const pct = ((latest.v - past.v) / past.v) * 100;
  if(pct < TREND_PCT_THRESHOLD) return null;
  return {pct: Math.round(pct), pastDate: past.d, pastValue: past.v, latestDate: latest.d, latestValue: latest.v};
}

function unitTrends(unit){
  const trends = [];
  STATUS_GASES.forEach(code=>{
    const g = unit.gases[code];
    if(!g) return;
    const t = gasTrend(g);
    if(t) trends.push({code, ...t});
  });
  trends.sort((a,b)=> b.pct - a.pct);
  return trends;
}

// 전체개요 "주요 모니터링 변압기 트렌드" 위젯에서 고를 수 있는 3가지 가스 그룹.
// 변압기별 상세 페이지의 3개 차트 카드(열적 이상가스/절연지 열화가스/수소)와 동일한 구성이라,
// 호기와 그룹을 고르면 상세 페이지를 열지 않고도 원하는 조합의 트렌드를 바로 볼 수 있다.
const MAIN_TREND_GAS_GROUPS = [

// 왼쪽 사이드바/전체 목록과 동일한 순서(그룹 순서 -> 그룹 내 원래 순서)로 변압기를 나열한다.
function unitsInSidebarOrder(){
  const groups = {};
  DATA.forEach((u,i)=>{ (groups[u.group] = groups[u.group] || []).push({u,i}); });
  const orderedGroupNames = [...GROUP_ORDER.filter(g=>groups[g]), ...Object.keys(groups).filter(g=>!GROUP_ORDER.includes(g))];

  orderedGroupNames.forEach(g=> groups[g].forEach(x=>out.push(x)));

function renderSidebar(){

  });
  let html = `<div class="brand">
    <div class="brand-title">유중가스 분석 시스템</div>
    <div class="brand-sub">변압기 절연유 DGA 모니터링</div>
  </div>`;
  html += `<div class="nav-home ${currentView==='overview'?'active':''}" data-nav="overview">전체 개요</div>`;
  html += `<div class="nav-home ${currentView==='standards'?'active':''}" data-nav="standards">한전 및 전문업체 기준</div>`;
  html += `<div class="nav-home ${currentView==='meaning'?'active':''}" data-nav="meaning">가스 종류별 주요 의미 및 이상징후</div>`;
  html += `<div class="nav-home ${currentView==='pattern'?'active':''}" data-nav="pattern">Pattern법 분류 (ECSG)</div>`;
  html += `<div class="nav-home ${currentView==='oilquality'?'active':''}" data-nav="oilquality">절연유 유질 판정기준 (전압별)</div>`;
  const orderedGroupNames = [...GROUP_ORDER.filter(g=>groups[g]), ...Object.keys(groups).filter(g=>!GROUP_ORDER.includes(g))];
  for(const group of orderedGroupNames){
    const units = groups[group];
    html += `<div class="nav-group"><div class="nav-group-title">${group}</div>`;
    units.forEach(u=>{
      const st = unitStatus(u).status;
      const active = currentView === ('unit:'+u.idx);
      html += `<div class="nav-item ${active?'active':''}" data-nav="unit:${u.idx}">

    });
    html += `</div>`;
  }

  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=>{ currentView = el.dataset.nav; render(); window.scrollTo(0,0); });
  });
}

function fmtDate(d){ return d; }
function fmtNum(v){ if(v==null) return '—'; return v.toLocaleString('ko-KR', {maximumFractionDigits:1}); }

// TDCG(가연성가스총량)는 이름이 길어 전체 목록 표에서는 빼고, 개별 변압기 상세 화면에서만 보여준다.
const MAIN_TABLE_GASES = ['H2','CH4','CO','CO2','C2H4','C2H6','C2H2'];

const PLAN_NOTE_TEXT = `- 발전소 전체 변압기 절연유 분석 매달 수행
  · 복합 3,4호기 변압기 밀착 관리
    복합 5호기 GT 및 ST 주변압기 여과(10월)`;

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function groupSummaryData(){
  const byGroup = {};
  DATA.forEach((u,i)=>{ (byGroup[u.group] = byGroup[u.group] || []).push({u,i}); });
  const out = [];
  GROUP_ORDER.forEach(group=>{
    const items = byGroup[group];
    if(!items) return;
    const withStatus = items.map(x=>({...x, st: unitStatus(x.u), trends: unitTrends(x.u)}));
    const bad = withStatus.filter(x=>x.st.status !== 'good');
    // 절대 기준치는 아직 안 넘었지만(=일반) 최근 급상승 중인 것만 별도로 모은다 - 조기 경보용.
    const trendingGood = withStatus.filter(x=>x.st.status === 'good' && x.trends.length);
    out.push({group, items: withStatus, bad, trendingGood});
  });
  return out;
}

function buildGroupSummaryLines(){
  return groupSummaryData().map(({group, items, bad, trendingGood})=>{
    let line;
    if(!bad.length){
      line = `<b>${group}</b>: 전 ${items.length}대 양호 범위 유지`;
    } else {
      const parts = bad.map(x=>{
        const r = x.st.reasons[0];
        const meta = GAS_META[r.code];
        return `${x.u.label} ${meta.label} <b>${fmtNum(r.value)}${meta.unit}</b> <span class="sev ${r.status}">(${statusLabel(r.status)})</span>`;
      });
      line = `<b>${group}</b>: ${parts.join(' · ')}`;
    }
    if(trendingGood.length){
      const tparts = trendingGood.map(x=>{
        const t = x.trends[0];
        const meta = GAS_META[t.code];
        return `${x.u.label} ${meta.label} 최근 90일 +${t.pct}%`;
      });
      line += ` <span class="trend-note">📈 ${tparts.join(' · ')} 관찰 필요</span>`;
    }
    return line;
  });
}

function buildGroupSummaryLinesPlain(){
  return groupSummaryData().map(({group, items, bad, trendingGood})=>{
    let line;
    if(!bad.length){
      line = `${group}: 전 ${items.length}대 양호 범위 유지`;
    } else {
      const parts = bad.map(x=>{
        const r = x.st.reasons[0];
        const meta = GAS_META[r.code];
        return `${x.u.label} ${meta.label} ${fmtNum(r.value)}${meta.unit}(${statusLabel(r.status)})`;
      });
      line = `${group}: ${parts.join(' · ')}`;
    }
    if(trendingGood.length){
      const tparts = trendingGood.map(x=>{
        const t = x.trends[0];
        const meta = GAS_META[t.code];
        return `${x.u.label} ${meta.label} 최근 90일 +${t.pct}%`;
      });
      line += ` (📈 ${tparts.join(' · ')} 관찰 필요)`;
    }
    return line;
  });
}

function buildAutoSummaryText(){
  return ['○ 호기별 분석 결과', ...buildGroupSummaryLinesPlain().map(l=>'- '+l), '', '○ 향후 계획', PLAN_NOTE_TEXT].join('\n');
}

// 어느 화면에서 고치든 다른 화면에도 즉시 반영된다.
const DETAIL_GAS_ROWS = ['H2','CH4','C2H4','C2H6','C2H2','C3H8','CO','CO2','TDCG','TGAS','BDV','ACID','MOIST'];

// 이 변압기가 가진 모든 측정일자(오름차순) - 표 상단 날짜 드롭다운을 채우는 데 쓴다.
function unitAllDates(unit){
  const set = new Set();
  Object.values(unit.gases).forEach(g => g.series.forEach(p => set.add(p.d)));
  return Array.from(set).sort();
}
function pointAtDate(series, date){
  if(!series) return null;
  for(const p of series) if(p.d === date) return p;
  return null;
}
// gasStatus()와 동일한 판정 로직이지만, 최신값이 아니라 임의 시점의 값을 판정할 수 있게 한 버전.
function gasStatusAtValue(code, gasObj, value){
  const meta = GAS_META[code];
  if(value == null || gasObj.caution == null || gasObj.alarm == null) return {status:'nodata', value};
  if(meta.reversed){
    if(value < gasObj.alarm) return {status:'critical', value};
    return {status:'good', value};
  }
  if(value >= gasObj.alarm) return {status:'critical', value};
  if(value >= gasObj.caution) return {status:'warning', value};
  return {status:'good', value};
}
// oilqParamStatus()와 동일하지만 임의 시점의 값을 판정한다.
function oilqParamStatusAtValue(unit, param, value){
  const vClass = oilqVoltageClassFor(unit);
  if(value == null || isNaN(value)) return {status:'nodata', value:null, voltageClass:vClass};
  const t = OILQ_THRESHOLDS_NUMERIC[vClass][param];
  const status = t.reversed
    ? oilqClassifyReversed(value, t.normalMin, t.alarmMax)
    : oilqClassifyNormal(value, t.normalMax, t.alarmMin);
  return {status, value, voltageClass: vClass};
}

/* ---- 개별 변압기 "현재 상태" 한 줄 요약 수정 기능 (localStorage, db_name 기준으로 저장) ---- */
const UNIT_NOTE_LS_KEY = 'dga_unit_status_note_v1';
let unitNoteEditing = false;
function getUnitNoteMap(){ try { return JSON.parse(localStorage.getItem(UNIT_NOTE_LS_KEY) || '{}'); } catch(e){ return {}; } }
function setUnitNote(dbName, text){
  const map = getUnitNoteMap();
  map[dbName] = text;
  try { localStorage.setItem(UNIT_NOTE_LS_KEY, JSON.stringify(map)); } catch(e){}
}
function clearUnitNote(dbName){
  const map = getUnitNoteMap();
  delete map[dbName];
  try { localStorage.setItem(UNIT_NOTE_LS_KEY, JSON.stringify(map)); } catch(e){}
}
function autoUnitNote(u){
  const st = unitStatus(u);
  if(!st.reasons.length) return '전체 가스 성분 기준치 이내로 양호 상태 유지';
  const r = st.reasons[0];
  const meta = GAS_META[r.code];
  return `${meta.label} ${fmtNum(r.value)}${meta.unit} ${statusLabel(r.status)} 수준`;
}
function renderUnitNotePanel(u){
  const body = document.getElementById('unitNotePanelBody');
  if(!body) return;
  const map = getUnitNoteMap();
  const saved = Object.prototype.hasOwnProperty.call(map, u.db_name) ? map[u.db_name] : null;
  if(unitNoteEditing){
    const seed = saved != null ? saved : autoUnitNote(u);
    body.innerHTML = `
      <textarea class="summary-textarea" id="unitNoteTextarea" style="min-height:70px;">${escapeHtml(seed)}</textarea>
      <div class="summary-edit-actions">
        <button class="btn-save" id="unitNoteSaveBtn" type="button">저장</button>
        <button class="btn-cancel" id="unitNoteCancelBtn" type="button">취소</button>
      </div>`;
    document.getElementById('unitNoteSaveBtn').addEventListener('click', ()=>{
      setUnitNote(u.db_name, document.getElementById('unitNoteTextarea').value);
      unitNoteEditing = false;
      renderUnitNotePanel(u);
    });
    document.getElementById('unitNoteCancelBtn').addEventListener('click', ()=>{
      unitNoteEditing = false;
      renderUnitNotePanel(u);
    });
    return;
  }
  const st = unitStatus(u);
  const cls = st.status === 'critical' ? 'critical' : st.status === 'warning' ? 'warning' : '';
  const text = saved != null ? saved : autoUnitNote(u);
  body.innerHTML = `<div class="unit-note-highlight ${cls}">${escapeHtml(text)}</div>
    ${saved != null ? `<div class="summary-override-note">✎ 직접 수정한 내용입니다 · <a id="unitNoteResetLink">자동 요약으로 초기화</a></div>` : ''}`;
  const resetLink = document.getElementById('unitNoteResetLink');
  if(resetLink) resetLink.addEventListener('click', ()=>{
    if(confirm('직접 작성한 상태 요약을 지우고 자동 생성 문구로 되돌릴까요?')){
      clearUnitNote(u.db_name);
      renderUnitNotePanel(u);
    }
  });
}

/* =========================================================================
   "한전 및 전문업체 관리 기준" 페이지 - 발전소 자체 DB 기준값과는 완전히 별도로
   보관되는 참고용 외부 기준표 2개(한전 / 변압기 전문업체). 정상/요주의Ⅰ/요주의Ⅱ/이상/위험
   5단계 판정기준표 형태이고, 각각 독립적으로 제목·내용을 수정하거나 엑셀로 업로드할 수 있다.
   ========================================================================= */
// 기본값은 사용자가 제공한 판정기준표 스캔본을 기준으로 입력한 값이다. 일산화탄소·이산화탄소는
// 표에 요주의Ⅱ 칸이 따로 없어(요주의Ⅰ 범위가 그대로 이상 직전까지 이어짐) caution2를 비워뒀다.
// 한전/전문업체 두 표 모두 이 기본값에서 시작하고, 이후 각자 독립적으로(별도 localStorage 키) 수정된다.

// ---- 한전/전문업체 기준 PDF 원본 보관 (IndexedDB) ----
// PDF는 용량이 커질 수 있어 localStorage가 아니라 IndexedDB에 저장한다.
// localStorage에는 파일명 등 가벼운 메타정보만 둬서 목록 표시를 즉시 할 수 있게 한다.
const PDF_META_LS_KEY = 'dga_standard_pdf_meta_v1';
function getPdfMeta(){ try { return JSON.parse(localStorage.getItem(PDF_META_LS_KEY) || '{}'); } catch(e){ return {}; } }
function setPdfMeta(map){ try { localStorage.setItem(PDF_META_LS_KEY, JSON.stringify(map)); } catch(e){} }

function openPdfDb(){
  return new Promise((resolve, reject)=>{
    if(typeof indexedDB === 'undefined'){ reject(new Error('이 브라우저는 파일 저장(IndexedDB)을 지원하지 않습니다.')); return; }
    const req = indexedDB.open('dga_pdf_store_v1', 1);
    req.onupgradeneeded = () => { req.result.createObjectStore('pdfs'); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function savePdfBlob(key, blob){
  const db = await openPdfDb();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction('pdfs', 'readwrite');
    tx.objectStore('pdfs').put(blob, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function loadPdfBlob(key){
  const db = await openPdfDb();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction('pdfs', 'readonly');
    const req = tx.objectStore('pdfs').get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function deletePdfBlob(key){
  const db = await openPdfDb();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction('pdfs', 'readwrite');
    tx.objectStore('pdfs').delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
function fmtFileSize(bytes){
  if(bytes == null) return '';
  if(bytes < 1024*1024) return Math.round(bytes/1024) + 'KB';
  return (bytes/1024/1024).toFixed(1) + 'MB';
}

// 섹션(한전/전문업체/유질기준 등)의 원본 자료(PDF 또는 이미지) 업로드 영역을 그린다:
// 업로드 전엔 업로드 버튼만, 업로드 후엔 파일명 + 보기/교체/삭제 버튼을 보여준다.
function renderStandardPdfRow(section){
  const el = document.getElementById('stdPdfRow-'+section.key);
  if(!el) return;
  const meta = getPdfMeta()[section.key];
  const pdfKey = section.key + '_pdf';
  if(meta){
    const icon = meta.mimeType && meta.mimeType.startsWith('image/') ? '🖼️' : '📄';
    el.innerHTML = `
      <span class="std-pdf-chip">${icon} ${escapeHtml(meta.filename)}${meta.size!=null?` <span class="std-pdf-size">(${fmtFileSize(meta.size)})</span>`:''}</span>
      <button class="btn-secondary" id="stdPdfViewBtn-${section.key}" type="button">보기</button>
      <button class="btn-secondary" id="stdPdfDownloadBtn-${section.key}" type="button">⭳ 다운로드</button>
      <button class="btn-secondary" id="stdPdfReplaceBtn-${section.key}" type="button">교체</button>
      <button class="btn-cancel" id="stdPdfDeleteBtn-${section.key}" type="button">삭제</button>
      <input type="file" id="stdPdfInput-${section.key}" accept="application/pdf,.pdf,image/*" style="display:none" />`;
    document.getElementById('stdPdfViewBtn-'+section.key).addEventListener('click', async ()=>{
      try {
        const blob = await loadPdfBlob(pdfKey);
        if(!blob){ alert('저장된 파일을 찾을 수 없습니다. 다시 업로드해 주세요.'); return; }
        const url = URL.createObjectURL(blob);
        window.open(url, '_blank');
      } catch(err){ alert('파일을 여는 중 문제가 발생했습니다: ' + err.message); }
    });
    document.getElementById('stdPdfDownloadBtn-'+section.key).addEventListener('click', async ()=>{
      try {
        const blob = await loadPdfBlob(pdfKey);
        if(!blob){ alert('저장된 파일을 찾을 수 없습니다. 다시 업로드해 주세요.'); return; }
        downloadBlob(blob, meta.filename || 'standard');
      } catch(err){ alert('다운로드 중 문제가 발생했습니다: ' + err.message); }
    });
    document.getElementById('stdPdfReplaceBtn-'+section.key).addEventListener('click', ()=>{
      document.getElementById('stdPdfInput-'+section.key).click();
    });
    document.getElementById('stdPdfDeleteBtn-'+section.key).addEventListener('click', async ()=>{
      if(!confirm('업로드된 파일을 삭제할까요?')) return;
      try { await deletePdfBlob(pdfKey); } catch(e){}
      const map = getPdfMeta();
      delete map[section.key];
      setPdfMeta(map);
      renderStandardPdfRow(section);
    });
  } else {
    el.innerHTML = `
      <button class="btn-secondary" id="stdPdfUploadBtn-${section.key}" type="button">📎 원본 자료 업로드</button>
      <span class="std-pdf-hint">원본 판정기준표 스캔본/사진/문서(PDF 또는 이미지)를 보관해두고 언제든 다시 열어볼 수 있습니다</span>
      <input type="file" id="stdPdfInput-${section.key}" accept="application/pdf,.pdf,image/*" style="display:none" />`;
    document.getElementById('stdPdfUploadBtn-'+section.key).addEventListener('click', ()=>{
      document.getElementById('stdPdfInput-'+section.key).click();
    });
  }
  document.getElementById('stdPdfInput-'+section.key).addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
    const isImage = file.type.startsWith('image/');
    if(!isPdf && !isImage){ alert('PDF 또는 이미지 파일만 업로드할 수 있습니다.'); e.target.value=''; return; }
    try {
      await savePdfBlob(pdfKey, file);
      const map = getPdfMeta();
      map[section.key] = { filename: file.name, size: file.size, mimeType: file.type, uploadedAt: new Date().toISOString() };
      setPdfMeta(map);
      renderStandardPdfRow(section);
    } catch(err){
      alert('파일 저장에 실패했습니다: ' + err.message);
    }
  });
}

function getStandardTitles(){ try { return JSON.parse(localStorage.getItem(STANDARD_TITLE_LS_KEY) || '{}'); } catch(e){ return {}; } }
function getStandardTitle(section){ const t = getStandardTitles()[section.key]; return (t != null && t !== '') ? t : section.defaultTitle; }
function setStandardTitle(section, title){
  const t = getStandardTitles();
  t[section.key] = title;
  try { localStorage.setItem(STANDARD_TITLE_LS_KEY, JSON.stringify(t)); } catch(e){}
}

function getExternalStandard(section){
  try {
    const saved = JSON.parse(localStorage.getItem(section.lsKey) || 'null');
    return Array.isArray(saved) ? saved : DEFAULT_EXTERNAL_STANDARD_ROWS.map(r=>({...r}));
  } catch(e){ return DEFAULT_EXTERNAL_STANDARD_ROWS.map(r=>({...r})); }
}
function setExternalStandard(section, rows){ try { localStorage.setItem(section.lsKey, JSON.stringify(rows)); } catch(e){} }
function clearExternalStandard(section){ try { localStorage.removeItem(section.lsKey); } catch(e){} }
function isDefaultExternalStandard(rows){ return JSON.stringify(rows) === JSON.stringify(DEFAULT_EXTERNAL_STANDARD_ROWS); }

// F=이상, G=위험, H=비고)과 똑같은 xlsx로 내보낸다. 수정 화면에서 고친 값도 그대로 반영된다.
function downloadStandardsExcel(section){
  const rows = getExternalStandard(section);
  const table = [['NO.','가스명','정상','요주의Ⅰ','요주의Ⅱ','이상','위험','비고']];
  rows.forEach(r=> table.push([r.no||null, r.gas||null, r.normal||null, r.caution1||null, r.caution2||null, r.alarm||null, r.danger||null, r.note||null]));
  const blob = buildXlsxBlob(table);
  const dateTag = (REPORT_DATE || '').replace(/[^0-9]/g, '') || 'export';
  downloadBlob(blob, `${getStandardTitle(section).replace(/^○\s*/, '').replace(/\s+/g,'_')}_${dateTag}.xlsx`);
}

// 엑셀 업로드 형식: A=NO, B=가스명(기존 표와 정확히 일치, 예: "수소 (H2)"), C=정상,
// D=요주의Ⅰ, E=요주의Ⅱ, F=이상, G=위험, H=비고(선택, 산소·질소처럼 "참고용" 문구를 넣을 항목만).
// 1행은 헤더로 건너뛰고 B열로 행을 매칭한다.
function wireStandardsUpload(section){
  const btn = document.getElementById('stdUploadBtn-'+section.key);
  const input = document.getElementById('stdXlsxInput-'+section.key);
  if(!btn || !input) return;
  const setStatus = (msg, isError)=>{
    const el = document.getElementById('stdUploadStatus-'+section.key);
    if(!el) return;
    el.textContent = msg || '';
    el.style.color = isError ? 'var(--critical)' : 'var(--text-muted)';
  };
  btn.addEventListener('click', ()=> input.click());
  input.addEventListener('change', async ()=>{
    const file = input.files && input.files[0];
    if(!file) return;
    setStatus('"' + file.name + '" 처리 중...', false);
    try{
      const buf = await file.arrayBuffer();
      const rows = await rowsFromXlsxArrayBuffer(buf);
      const current = getExternalStandard(section).map(r=>({...r}));
      const byGas = new Map(current.map((r,i)=>[r.gas, i]));
      const toStr = v => (v===null || v===undefined) ? '' : String(v);
      let matched = 0;
      for(let r = 1; r < rows.length; r++){
        const row = rows[r] || [];
        const gasName = typeof row[1] === 'string' ? row[1].trim() : null;
        const idx = gasName != null ? byGas.get(gasName) : undefined;
        if(idx == null) continue;
        matched++;
        current[idx] = {
          ...current[idx],
          no: toStr(row[0]) || current[idx].no,
          normal: toStr(row[2]),
          caution1: toStr(row[3]),
          caution2: toStr(row[4]),
          alarm: toStr(row[5]),
          danger: toStr(row[6]),
          note: toStr(row[7]),
        };
      }
      if(!matched) throw new Error('일치하는 가스명을 찾지 못했습니다. B열=가스명이 기존 표와 정확히 같은지(예: "수소 (H2)") 확인해주세요.');
      setExternalStandard(section, current);
      renderStandardsTable(section);
      setStatus('"' + file.name + '" 반영 완료 (' + matched + '개 항목)', false);
    } catch(err){
      console.error(err);
      setStatus('업로드 실패: ' + err.message, true);
    } finally {
      input.value = '';
    }
  });
}

    <div class="table-card" style="padding:16px;">

        <tbody>${multiRows}</tbody>

    </div>
  </div>`;

  document.getElementById('main').innerHTML = html;
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=>{ currentView = el.dataset.nav; render(); window.scrollTo(0,0); });
  });

  const editBtn = document.getElementById('meaningEditBtn');
  if(editBtn) editBtn.addEventListener('click', ()=>{ meaningEditing = true; renderMeaningBody(); });

  const cancelBtn = document.getElementById('meaningCancelBtn');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ meaningEditing = false; renderMeaningBody(); });

  const doneBtn = document.getElementById('meaningDoneBtn');
  if(doneBtn) doneBtn.addEventListener('click', ()=>{
    const next = { single: data.single.map(r=>({...r})), pair: data.pair.map(r=>({...r})), multi: data.multi.map(r=>({...r})) };
    document.querySelectorAll('.meaning-input').forEach(inp=>{

    document.querySelectorAll('.meaning-checkbox').forEach(cb=>{
      const table = cb.dataset.table, idx = parseInt(cb.dataset.idx,10), field = cb.dataset.field;

    document.querySelectorAll('.meaning-select').forEach(sel=>{

      next[table][idx][field] = sel.value;

    meaningEditing = false;

  const resetLink = document.getElementById('meaningResetLink');
  if(resetLink) resetLink.addEventListener('click', ()=>{
    if(confirm('수정한 내용을 지우고 기본값으로 되돌릴까요?')){
      clearGasMeaningOverride();
      renderMeaningBody();
    }
  });
}

   5종(H2, CH4, C2H6, C2H4, C2H2)의 조성비를 최댓값=1로 정규화해 도형으로 그리고,
   그 형상에 따라 결함 유형을 4가지(H2/C2H4/C2H2/CH4 주도형)로 대분류하는 참고 자료.
   각 그룹의 패턴 도형(값)은 원본 참고자료의 고정 도해이므로 수정 대상이 아니고,
   설명 텍스트(원리 소개 + 그룹별 진단 설명)만 가스종류별 의미 페이지와 같은 방식으로
   이 브라우저에 저장해 수정할 수 있게 한다.
   ========================================================================= */
const PATTERN_METHOD_INTRO_DEFAULT = `가스패턴에 의한 진단방법이다. 가로축(X축)에 가연성가스 5종을 H2 → CH4 → C2H6 → C2H4 → C2H2 순서(분자결합 에너지가 낮은 순)로 배열하고, 세로축(Y축)에는 검출된 가스 중 최댓값을 1.0으로 정규화한 상대적 조성비를 Plot하여 모형도를 그린다. 이렇게 그려진 형상(패턴)에 따라 이상의 내용을 진단한다.

이 진단법은 표시가 도형이기 때문에 현상을 감각적으로 이해하기 쉽고, 이상현상의 내용 변화가 곧 모형의 변화로 나타나며, 과거 사고사례와 대비한 진단이 용이하다는 특징을 지닌다.

크게 4가지 유형으로 분류한다 — H2 주도형(부분방전·아크방전), C2H4 주도형과 CH4 주도형(접촉불량·누설전류에 의한 과열), C2H2 주도형(섬락 등의 아크방전).`;

const PATTERN_METHOD_LS_KEY = 'dga_pattern_method_override_v1';

// 고정된 5개 값을 정적 SVG 꺾은선으로 그린다 (드릴다운/툴팁 없는 참고용 축소 그림).
function miniPatternSvg(values){
  const labels = ['H2','CH4','C2H6','C2H4','C2H2'];
  const W = 200, H = 110;
  const padL = 24, padR = 6, padT = 8, padB = 16;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const n = values.length;
  const xFor = i => padL + (plotW * i/(n-1));
  const yFor = v => padT + plotH - (plotH * Math.max(0, Math.min(1, v)));
  let svg = `<svg class="pattern-mini-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;
  [0,0.5,1.0].forEach(t=>{
    const y = yFor(t);
    svg += `<line class="gridline" x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" />`;
    svg += `<text class="axislabel" x="${padL-4}" y="${y+3}" text-anchor="end" style="font-size:8px;">${t.toFixed(1)}</text>`;
  });
  labels.forEach((l,i)=>{
    svg += `<line class="gridline" x1="${xFor(i)}" y1="${padT}" x2="${xFor(i)}" y2="${padT+plotH}" />`;
    svg += `<text class="axislabel" x="${xFor(i)}" y="${H-4}" text-anchor="middle" style="font-size:7px;">${l}</text>`;
  });
  svg += `<line class="axisline" x1="${padL}" y1="${padT+plotH}" x2="${W-padR}" y2="${padT+plotH}" />`;
  let d = '';
  values.forEach((v,i)=>{ d += (d?' L ':'M ') + xFor(i).toFixed(1) + ' ' + yFor(v).toFixed(1); });
  svg += `<path class="series-line" d="${d}" style="stroke:var(--c-violet)" />`;
  values.forEach((v,i)=>{ svg += `<circle cx="${xFor(i)}" cy="${yFor(v)}" r="2.6" fill="var(--c-violet)" />`; });
  svg += `</svg>`;
  return svg;
}

let patternEditing = false;

function renderPatternPage(){
  patternEditing = false;
  renderPatternBody();
}

function renderPatternBody(){
  const intro = activePatternIntro();
  const hasOverride = !!getPatternMethodOverride();

  const actionsHtml = patternEditing
    ? `<div class="summary-edit-actions" style="margin-top:0;">
        <button class="btn-save" id="patternDoneBtn" type="button">완료</button>
        <button class="btn-cancel" id="patternCancelBtn" type="button">취소</button>
      </div>`
    : `<div style="display:flex; align-items:center; gap:10px;">
        ${hasOverride ? `<span class="summary-override-note" style="margin-top:0;">✎ 수정됨 · <a id="patternResetLink">기본값으로 초기화</a></span>` : ''}
        <button class="panel-edit-btn" id="patternEditBtn" type="button">✎ 수정</button>
      </div>`;

  const introHtml = patternEditing
    ? `<textarea class="summary-textarea" id="patternIntroTextarea" style="min-height:140px;">${escapeHtml(intro)}</textarea>`
    : `<div class="plan-note">${escapeHtml(intro)}</div>`;

  const groupsHtml = PATTERN_GROUPS_DEFAULT.map(g=>{
    const diagText = activePatternGroupText(g.key);
    const chartsHtml = g.patterns.map(p=>`
      <div class="pattern-mini-card">
        <div class="pattern-mini-label">${p.id}</div>
        ${miniPatternSvg(p.values)}
      </div>`).join('');
    const diagHtml = patternEditing
      ? `<textarea class="summary-textarea pattern-diag-textarea" data-group="${g.key}" style="min-height:110px;">${escapeHtml(diagText)}</textarea>`
      : `<div class="plan-note">${escapeHtml(diagText)}</div>`;
    return `
    <div class="meaning-section">
      <div class="meaning-section-title">${g.title} <span class="th-note">(${g.figureLabel})</span></div>
      <div class="table-card" style="padding:16px;">
        <div class="pattern-mini-grid">${chartsHtml}</div>
        ${diagHtml}
      </div>
    </div>`;
  }).join('');

  const html = `
  <div class="table-heading-row">
    <div class="page-title" style="margin:0;">Pattern법 분류 (ECSG: Electricity Cooperative Study Group, Japan)</div>
    ${actionsHtml}
  </div>
  <div class="page-meta" style="margin-bottom:16px;">가스 성분의 조성비를 도형(패턴)으로 그려 결함 유형을 진단하는 방법입니다${patternEditing ? ' (내용을 고친 뒤 "완료"를 누르면 이 브라우저에 저장됩니다).' : '.'}</div>

  <div class="meaning-section">
    <div class="meaning-section-title">1. 작성 방법 (원리)</div>
    <div class="table-card" style="padding:16px;">
      ${introHtml}
      <ul class="summary-list" style="margin-top:12px;">
        <li><b>가로축(X축)</b>: 가연성가스 5종을 <b>H2 → CH4 → C2H6 → C2H4 → C2H2</b> 순서로 배열 (분자결합 에너지가 낮은 순)</li>
        <li><b>세로축(Y축)</b>: 검출된 5종 가스 중 <b>최댓값을 1.0</b>으로 정규화한 상대적 조성비 (0~1)</li>
        <li>완성된 도형의 <b>형상(어느 가스가 정점을 이루는지)</b>에 따라 결함 유형을 4가지로 대분류한다</li>
      </ul>
    </div>
  </div>

  <div class="meaning-section-sub" style="margin:0 4px 16px;">2. 패턴으로 알 수 있는 내용 (패턴별 분류)</div>
  ${groupsHtml}
  `;

  document.getElementById('main').innerHTML = html;
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=>{ currentView = el.dataset.nav; render(); window.scrollTo(0,0); });
  });

  const editBtn = document.getElementById('patternEditBtn');
  if(editBtn) editBtn.addEventListener('click', ()=>{ patternEditing = true; renderPatternBody(); });

  const cancelBtn = document.getElementById('patternCancelBtn');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ patternEditing = false; renderPatternBody(); });

  const doneBtn = document.getElementById('patternDoneBtn');
  if(doneBtn) doneBtn.addEventListener('click', ()=>{
    const next = { intro: document.getElementById('patternIntroTextarea').value, groups: {} };
    document.querySelectorAll('.pattern-diag-textarea').forEach(ta=>{
      next.groups[ta.dataset.group] = ta.value;
    });
    setPatternMethodOverride(next);
    patternEditing = false;
    renderPatternBody();
  });

  const resetLink = document.getElementById('patternResetLink');
  if(resetLink) resetLink.addEventListener('click', ()=>{
    if(confirm('수정한 내용을 지우고 기본값으로 되돌릴까요?')){
      clearPatternMethodOverride();
      renderPatternBody();
    }
  });
}

/* =========================================================================
   절연유 유질 판정기준 (전압별) - 가스 성분 임계값(한전/전문업체 기준)과는 별개로,
   절연유(오일) 자체의 물리·화학적 특성(수분, 절연파괴전압=내전압, 전산값=전산가)을
   변압기 정격전압 등급(66kV 이하 / 154~200kV / 345kV 이상)별로 정상·요주의·이상
   3단계로 판정하는 참고표다 (JIS/IEC 기준). 개별 변압기 상세 페이지의 내전압·전산가·
   수분측정 트렌드 차트 값을 해석할 때 참고 기준으로 쓴다.
   ========================================================================= */
const OILQ_INTRO_DEFAULT = `절연유(변압기유)는 시간이 지나면서 수분을 흡습하고 산화·열화가 진행되며, 그 정도를 정기적인 유질(오일) 분석으로 판정한다. 판정 기준은 변압기의 정격전압이 높을수록 절연 여유가 작아 더 엄격한(낮은) 임계값을 적용한다.

- 수분(ppm): 절연유에 녹아있는 수분의 양. 수분이 많을수록 절연내력이 떨어지고, 절연지(고체절연물)의 열화도 촉진된다.
- 절연파괴전압/내전압(kV, BDV): 절연유에 일정 간격을 두고 전압을 걸었을 때 방전(파괴)이 일어나는 전압. 값이 낮을수록 절연유가 오염되거나 열화되어 절연 성능이 저하된 상태다.
- 전산값/전산가(mgKOH/g, ACID): 절연유 1g을 중화하는 데 필요한 KOH의 양으로, 절연유의 산화 열화 정도를 나타낸다. 값이 높을수록 절연유의 산화·노화가 진행되어 슬러지(오니) 생성 우려가 커진다.

본 표는 각 변압기 상세 페이지의 "내전압 트렌드·전산가 트렌드·수분측정 트렌드" 값을 해석할 때 참고 기준으로 활용할 수 있다 (다만 대시보드의 자동 판정은 데이터베이스에 저장된 임계값을 기준으로 하며, 이 표는 보조 참고용이다).`;

const OILQ_VOLTAGE_CLASS_BY_DBNAME = {
  'G/T Main T/R #51/52': '345',
  'G/T Main T/R #61/62': '345',
  'S/T Main T/R #50/60': '345',
};
function oilqVoltageClassFor(unit){
  return OILQ_VOLTAGE_CLASS_BY_DBNAME[unit.db_name] || '154';
}
function oilqVoltageClassLabel(vClass){
  if(vClass === '345') return '345kV 이상';
  if(vClass === '66') return '66kV 이하';
  return '154~200kV';
}

// 판정기준표의 문구(50 미만/50~60/60 초과 등)를 계산에 쓰기 위해 숫자 경계값으로 옮겨둔 표.
// moisture/acid: 값이 높을수록 나쁨(normalMax 이하=정상, alarmMin 이상=이상, 그 사이=요주의).
// bdv: 값이 낮을수록 나쁨(normalMin 이상=정상, alarmMax 미만=이상, 그 사이=요주의).
const OILQ_THRESHOLDS_NUMERIC = {
  '66':  { moisture:{normalMax:50, alarmMin:60}, bdv:{normalMin:30, alarmMax:30, reversed:true}, acid:{normalMax:0.20, alarmMin:0.41} },
  '154': { moisture:{normalMax:40, alarmMin:50}, bdv:{normalMin:40, alarmMax:30, reversed:true}, acid:{normalMax:0.10, alarmMin:0.31} },
  '345': { moisture:{normalMax:30, alarmMin:40}, bdv:{normalMin:50, alarmMax:40, reversed:true}, acid:{normalMax:0.10, alarmMin:0.31} },
};
function oilqClassifyNormal(value, normalMax, alarmMin){
  if(value == null || isNaN(value)) return 'nodata';
  if(value >= alarmMin) return 'critical';
  if(value > normalMax) return 'warning';
  return 'good';
}
function oilqClassifyReversed(value, normalMin, alarmMax){
  if(value == null || isNaN(value)) return 'nodata';
  if(value < alarmMax) return 'critical';
  if(value < normalMin) return 'warning';
  return 'good';
}
// param: 'moisture' | 'bdv' | 'acid'
function oilqParamStatus(unit, param){
  const codeMap = {moisture:'MOIST', bdv:'BDV', acid:'ACID'};
  const g = unit.gases[codeMap[param]];
  const lp = g ? lastPoint(g.series) : null;
  const vClass = oilqVoltageClassFor(unit);
  if(!lp) return {status:'nodata', value:null, voltageClass:vClass};
  const t = OILQ_THRESHOLDS_NUMERIC[vClass][param];
  const status = t.reversed
    ? oilqClassifyReversed(lp.v, t.normalMin, t.alarmMax)
    : oilqClassifyNormal(lp.v, t.normalMax, t.alarmMin);
  return {status, value: lp.v, voltageClass: vClass};
}

// 상세 페이지의 "측정 성분 상세" 표에서 BDV/ACID/MOIST 행에 표시할 요주의/이상 숫자를
// 절연유 유질 판정기준(전압별)의 해당 변압기 등급 기준으로 계산한다.
const OILQ_PARAM_BY_CODE = {BDV:'bdv', ACID:'acid', MOIST:'moisture'};
function oilqThresholdPair(code, unit){
  const param = OILQ_PARAM_BY_CODE[code];
  if(!param) return null;
  const vClass = oilqVoltageClassFor(unit);
  const t = OILQ_THRESHOLDS_NUMERIC[vClass][param];
  return t.reversed ? {caution: t.normalMin, alarm: t.alarmMax} : {caution: t.normalMax, alarm: t.alarmMin};
}

function oilqStatusLabel(status){
  if(status === 'critical') return '이상';
  if(status === 'warning') return '요주의';
  if(status === 'good') return '정상';
  return '—';
}
// 차트 카드 제목 옆 상태 칩(span.status-chip)에 절연유 유질 판정 결과를 반영한다.
function setOilqStatusChip(elId, status){
  const el = document.getElementById(elId);
  if(!el) return;
  if(status === 'nodata'){ el.className = ''; el.textContent = ''; return; }
  el.className = 'status-chip ' + status;
  el.textContent = oilqStatusLabel(status);
}

// 기준값(이상/요주의) 표 헤더 두 줄을 만든다. thresholdEditing이면 각 셀이 입력창이 된다.
function renderThresholdRows(sample){
  function rowCells(kind){
    return MAIN_TABLE_GASES.map(c=>{
      const g = sample.gases[c];
      const val = g && g[kind] != null ? g[kind] : '';
      if(thresholdEditing){
        return `<td><input type="number" class="thresh-input" data-gas="${c}" data-kind="${kind}" value="${val}" /></td>`;
      }
      return `<td>${val === '' ? '' : fmtNum(val)}</td>`;
    }).join('');
  }
  return `
    <tr class="thresh-row alarm">
      <th colspan="3">이상</th>
      ${rowCells('alarm')}
    </tr>
    <tr class="thresh-row caution">
      <th colspan="3">요주의</th>
      ${rowCells('caution')}
    </tr>`;
}
